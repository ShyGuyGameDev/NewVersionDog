/* The slider itself */
.slider {
-webkit-appearance: none;  /* Override default CSS styles */
appearance: none;
width: 100%; /* Full-width */
height: 12px; /* Specified height */
border-radius: 5px;
background: #d3d3d3; /* Grey background */
outline: none; /* Remove outline */
opacity: 0.7; /* Set transparency (for mouse-over effects on hover) */
-webkit-transition: .2s; /* 0.2 seconds transition on hover */
transition: opacity .2s;
}

/* Mouse-over effects */
.slider:hover {
opacity: 1; /* Fully shown on mouse-over */
}

/* The slider handle (use -webkit- (Chrome, Opera, Safari, Edge) and -moz- (Firefox) to override default look) */
.slider::-webkit-slider-thumb {
-webkit-appearance: none; /* Override default look */
appearance: none;
width: 20px; /* Set a specific slider handle width */
height: 20px; /* Slider handle height */
border-radius: 50%;
background: #4CAF50; /* Green background */
cursor: pointer; /* Cursor on hover */
}

.slider::-moz-range-thumb {
width: 20px; /* Set a specific slider handle width */
height: 20px; /* Slider handle height */
border-radius: 50%;
background: #4CAF50; /* Green background */
cursor: pointer; /* Cursor on hover */
}

/* The switch - the box around the slider */
    .switch {
        position: relative;
        display: inline-block;
        width: 60px;
        height: 34px;
    }

/* Hide default HTML checkbox */
    .switch input {display:none;}

/* The slider */
    .swslider {
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: #ccc;
            -webkit-transition: .4s;
        transition: .4s;
    }

    .swslider:before {
        position: absolute;
        content: "";
        height: 26px;
        width: 26px;
        left: 4px;
        bottom: 4px;
        background-color: white;
            -webkit-transition: .4s;
        transition: .4s;
    }

input:checked + .swslider {
    background-color: #2196F3;
}

input:focus + .swslider {
    box-shadow: 0 0 1px #2196F3;
}

input:checked + .swslider:before {
        -webkit-transform: translateX(26px);
        -ms-transform: translateX(26px);
    transform: translateX(26px);
}

/* Rounded sliders */
    .swslider.round {
        border-radius: 34px;

<script type='text/javascript' >

var stimeout = null; //for repeatedly fetching status
var rptimeout = null;
var reconnect_timer = false;
var connected = false;

function clearTimers()
{
    if (stimeout)
    {
        window.clearTimeout(stimeout);
        stimeout = null;
    }
}
var reconnect_timer = null;
function networkError()
{
    did("conn").innerHTML="Disconnected";
    did("conn").className="connoff";
    if ( connected )
    {
        clearTimers();
        connected = false;
    }
    //set reconnect timer?
    if ( !reconnect_timer )
    {
        reconnect_timer = window.setTimeout( "toggleConnection()", 1000 );
    }
}

function toggleConnection()
{
    if ( connected )
    {
        clearTimers();
        networkError();
    }
    else
    {
        clearTimers();
        connected = true;
        if ( reconnect_timer )
        {
            reconnect_timer = null;
            did("conn").innerHTML="Connecting..";
            did("conn").className="connoff";
        }
        else
        {
            did("conn").innerHTML="Connected";
            did("conn").className="connon";
        }
        stimeout = window.setTimeout( "getSceneUpdates()", 500 );
    }
}

function startVisualizer(robot, target)
{
    pageinit();
    createRobot(robot, target);
    toggleConnection();
}

//common response function for ajax calls where we dont need to do anything
function onDoNothing(r){}

function sja( n,isl,ang) //set joint angle
{
    allobjects["LEG"+n][(isl?"obj_link":"obj_origin")].rotation.x = ang * d2r;
}

function setRobotHeight()
{
    //get min z-coord of front legs
    //and min z-coord of rear legs
    //try simple first
    var p = new THREE.Vector3();
    allobjects["LEGFLFOOT"].obj_origin.getWorldPosition( p );
    var minz_front = p.z;
    allobjects["LEGFRFOOT"].obj_origin.getWorldPosition( p );
    if ( p.z < minz_front )
        minz_front = p.z;

    //console.log( minz_front );

    allobjects["LEGBLFOOT"].obj_origin.getWorldPosition( p );
    var minz_back = p.z;
    allobjects["LEGBRFOOT"].obj_origin.getWorldPosition( p );
    if ( p.z < minz_back )
        minz_back = p.z;

    var minz = minz_front;
    if ( minz_back < minz )
        minz = minz_back;
    //console.log( "minz: " + minz );
    if ( Math.abs(minz-5) > 1 )
    {
        var pos = allobjects["ROBOT_BASE"].obj_origin.position;
        //console.log( "robot_base1: " + pos.z );
        pos.z += (-minz + 5 );
        console.log( "robot_base2: " + pos.z );
    }
}

function getSceneUpdates()
{
    execAjaxSimpleJson( "getstatus", "", onResponse, networkError );
    function onResponse(j)
    {
        if ( did("conn").innerHTML != "Connected" )
        {
            did("conn").innerHTML="Connected";
            did("conn").className="connon";
        }
        if ( j.hasOwnProperty("status") && j["status"] )
        {
            var s = j["status"]["pos"];
            var f = s.split("," );
            sja( "FLROT", 1, f[4] );
            sja( "FLHIP", 1, -f[5] );
            sja( "FLKNEE", 0, f[6] );

            sja( "BLROT", 1, f[7] );
            sja( "BLHIP", 1, -f[8] );
            sja( "BLKNEE", 0, f[9] );

            sja( "FRROT", 1, f[10] );
            sja( "FRHIP", 1, -f[11] );
            sja( "FRKNEE", 0, f[12] );

            sja( "BRROT", 1, f[13] );
            sja( "BRHIP", 1, -f[14] );
            sja( "BRKNEE", 0, f[15] );

            if ( j["status"].hasOwnProperty( "evodogpos" ) )
                processUpdates( j["status"]["evodogpos"] );
            //setRobotHeight();
        }

        if (stimeout) { window.clearTimeout(stimeout); }
        stimeout = window.setTimeout( "getSceneUpdates()", 300 );

    }
}

var last_pub_val = 0;
var stop_counter = 0;
function startwheelmotion(turn_id, speed_id, pub_id)
{
    var turnval;
    var speedval;
    var pubval;
    var turn;
    var speed;
    var pub;

    turn = document.getElementById(turn_id);
    turnval = (turn == null ? 0 : turn.value);

    speed = document.getElementById(speed_id);
    speedval = (speed == null ? 0 : speed.value);

    pub = document.getElementById(pub_id);
    pubval = (pub == null ? -1 : pub.value);

    if(pubval == 1)
    {
        wheelc(-turnval, speedval); //-turnval because (+) turnval is turn_left in evoquad, but it is on the right side of the slider here

        if (rptimeout) { window.clearTimeout(rptimeout); }
        rptimeout = window.setTimeout( "startwheelmotion('slider_turn', 'slider_speed', 'publish_cmd')", 150 );
        
    }
    else if(pubval == 0)
    {
        if(last_pub_val == 1 && pubval == 0)
        {
            turn.value = 0;
            speed.value = 0;
            mu_wheel_timeout = setInterval(function(){
                wheelc(turn.value, speed.value);
                stop_counter++;
                if(stop_counter % 3 == 0)
                {
                    clearInterval( mu_wheel_timeout );
                    mu_wheel_timeout = null;
                }
            }, 150 );
        }
                
        if (rptimeout) { window.clearTimeout(rptimeout); }
        rptimeout = window.setTimeout( "startwheelmotion('slider_turn', 'slider_speed', 'publish_cmd')", 500 );
    }

    last_pub_val = pubval;
}

function arrayround(a,suffix)
{
    if (!suffix) suffix = "";
    var b=[];
    for(var i=0;i<a.length;i++)
        b.push(Math.round(a[i])+suffix);
    return b;
}

{
    if ( a1.length != a2.length )
        return false;
    for(var i=0; i < a1.length; i++)
        if( a1[i] != a2[i] )
            return false;
    return true;
}

        var orot = Math.round(o["yaw"]);//arrayround(o.origin["r"],"&#176;");
        //var orot = arrayround(o.origin["r"],"&#176;");
        h += "<tr><td>"+oid+"</td><td onclick='objdlg(\""+oid+"\")'>"+o.name
            +"</td><td><button onclick='gview(\""+oid+"\")' id='opos-"+oid+"' style='min-width:70px;'>"+opos+"</button>"
            +"</td><td id='osh-"+oid+"' style='min-width:20px;'>"+Math.round(o["sh"])
            +"</td><td id='orot-"+oid+"' style='min-width:20px;'>"+orot;
            //+"</td><td id='armo-"+oid+"' style='min-width:20px;'>"+armo;
        //if ( show_grrelpos )
            h += "</td><td id='gropos-"+oid+"' style='min-width:20px;'>"+gropos;
        //if ( show_grrelori )
            h += "</td><td id='grorot-"+oid+"' style='min-width:20px;'>"+grorot;
        //if ( did("robotrelpos").checked )
        h += "</td><td id='roboto-"+oid+"' style='min-width:20px;'>"+roboto;
        h += "</td><td><button onclick='deleteobj("+oid+")'>Delete</button>"
            +"</td><td>"+(o["sid"]>0?allobjects["SURFACE-"+o["sid"]].name:"None")
            +"</td></tr>";
    }
    h += "</table>";
    did("objs").innerHTML = h;
    g_object_ids = new_ids;//this is whats currently displayed now
}


</script>
